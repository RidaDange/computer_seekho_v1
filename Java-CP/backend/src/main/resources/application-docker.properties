# Profile for running inside docker-compose.
#
# Separate from `prod` on purpose. The prod profile declares ${DB_URL} and
# ${MAIL_HOST} with no defaults, so the application refuses to start unless
# a real deployment has supplied every one of them — which is exactly what
# you want in production and exactly what you don't want when someone runs
# `docker compose up` to look at the project for the first time.
#
# Here every value has a working default and the only things worth setting
# are the secrets.

# 'mysql' is the compose service name, resolved on the container network.
# localhost inside the backend container is the backend itself.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/computerseekho?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:computerseekho}

# schema.sql remains the source of truth; the DB container loads it on first
# boot. validate still catches an entity that has drifted from the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Written to a named volume, so uploaded photos survive `docker compose down`
# and a rebuilt image. Without this they'd live in the container's writable
# layer and vanish with it.
app.uploads.dir=${UPLOADS_DIR:/app/uploads}

# The browser talks to the published ports, not to the compose network, so
# these are the host-facing origins.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

# Optional everywhere: blank means the feature is unavailable and the app
# says so at startup rather than failing to boot.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.enabled=${MAIL_ENABLED:true}

logging.level.com.smvita.computerseekho=INFO

# Containers are treated as disposable, so a stack trace has to be readable
# from `docker compose logs` — there is no console to attach to.
app.expose-error-details=false
