spring.application.name=computerseekho-backend
spring.profiles.active=dev

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Where uploaded images are written. Relative to the working directory in
# dev, so the folder sits beside the project and survives a rebuild; set
# UPLOADS_DIR to an absolute path anywhere it needs to outlive the checkout.
# The directory is created at startup if it doesn't exist.
app.uploads.dir=${UPLOADS_DIR:./uploads}

server.port=8080
server.servlet.context-path=/api

management.endpoints.web.exposure.include=health,info
# The mail health check actually opens an SMTP connection, so it's driven by
# the same switch as sending: on once MAIL_USERNAME is set, off otherwise.
# Leaving it on with no credentials would report the whole app as DOWN.
management.health.mail.enabled=${MAIL_ENABLED:false}
management.endpoint.health.show-details=when_authorized

app.jwt.secret=${JWT_SECRET:change-this-in-prod-to-a-long-random-secret}
app.jwt.expiration-ms=86400000
app.contact-notification-email=training@vita.com

# --- Visitor sign-in (OAuth2 / Google) ---------------------------------
# Credentials come from the environment; the client secret must never sit
# in the repo. Blank means visitor sign-in is simply not available on this
# machine, which the startup log reports rather than failing the boot.
#
# Spring Boot already knows Google's authorization, token and userinfo URLs
# (CommonOAuth2Provider), so only the registration below is needed.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Where the visitor is sent once Google has authenticated them. This is the
# React route, not an API path — the JWT is handed to the SPA there.
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

# A visitor token is deliberately shorter-lived than a staff one. It exists
# to submit an enquiry, not to hold a working session open all day.
app.jwt.visitor-expiration-ms=${VISITOR_TOKEN_TTL_MS:3600000}
