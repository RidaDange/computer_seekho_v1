# allowPublicKeyRetrieval is needed because MySQL 8 authenticates with
# caching_sha2_password: on an unencrypted connection the driver has to fetch
# the server's public key to encrypt the password, and that fetch is refused
# by default. The server caches a successful auth until it restarts, which is
# why this only surfaces after a MySQL restart rather than immediately.
#
# Safe here and only here. Retrieving a key from an unauthenticated server is
# a man-in-the-middle opening, which is tolerable against localhost and is
# not why the production profile exists — application-prod.properties builds
# its URL from ${DB_URL} and should keep TLS on instead.
spring.datasource.url=jdbc:mysql://localhost:3306/computerseekho?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pr@23012004

# schema.sql is the source of truth, not Hibernate auto-generation.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Email -------------------------------------------------------------
# Credentials come from environment variables and are never written into
# this file — it lives in the repo. For Gmail, MAIL_PASSWORD must be a
# 16-character App Password, not the account password (Google blocks
# plain-password SMTP). See DAY3.md for the setup steps.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Without these, an unreachable SMTP host hangs the request thread
# indefinitely instead of failing fast — the enquiry POST would appear to
# freeze rather than return.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.enabled=${MAIL_ENABLED:true}

logging.level.com.smvita.computerseekho=DEBUG

# Dev only: echo the real exception type/message back in 500 responses so a
# failure is visible in the browser network tab, not just the server console.
app.expose-error-details=true
