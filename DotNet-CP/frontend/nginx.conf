server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space. A visitor who reloads on
    # /campus-life/albums/3, or lands on /oauth/callback coming back from
    # Google, is asking nginx for a file that does not exist — without this
    # fallback both are a 404 and the OAuth flow dies on the last hop.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints every asset filename with a content hash, so a given
    # URL's contents can never change. index.html must not be cached the
    # same way: it is the only file with a stable name, and a cached copy
    # would keep pointing at the previous build's hashed assets.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
